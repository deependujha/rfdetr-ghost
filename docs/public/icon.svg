<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .g-bg { fill: #050a12; }
        .g-border { stroke: #39d9ff; }
        .g-text { fill: #39d9ff; }
      }
      @media (prefers-color-scheme: light) {
        .g-bg { fill: #ffffff; }
        .g-border { stroke: #1677ff; }
        .g-text { fill: #1677ff; }
      }
    </style>
  </defs>
  <rect class="g-bg" width="32" height="32" rx="4"/>
  <rect class="g-border" x="2" y="2" width="28" height="28" rx="3" fill="none" stroke-width="1.5"/>
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" class="g-text">G</text>
</svg>
